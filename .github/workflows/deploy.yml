name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Bootstrap
        working-directory: Bootstrap
        run: |
          npm ci
          npm run build

      - name: Build Bulma
        working-directory: Bulma
        run: |
          npm ci
          npm run build

      - name: Build TailwindCSS
        working-directory: TailwindCSS
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r Bootstrap/dist site/bootstrap
          cp -r Bulma/dist site/bulma
          cp -r TailwindCSS/dist site/tailwind
          cp index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
